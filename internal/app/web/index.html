<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>otsn</title>
<style>
  :root {
    --bg: #fafbfe;
    --panel: rgba(255, 255, 255, .88);
    --line: rgba(125, 180, 249, .28);
    --line-2: rgba(125, 180, 249, .14);
    --fg: #3a4453;
    --dim: #8b96a5;
    --acc: rgb(125, 180, 249);
    --acc2: #4a7dbd;
    --up: #4a7dbd;
    --down: #9aa4b2;
    --shadow: 0 10px 30px rgba(80, 110, 160, .12);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.55 var(--mono);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 背景：极淡的蓝色晕染 + 网格 */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 480px at 15% -10%, rgba(125, 180, 249, .16), transparent 60%),
      radial-gradient(900px 480px at 90% 0%, rgba(125, 180, 249, .08), transparent 60%),
      linear-gradient(rgba(125, 180, 249, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125, 180, 249, .06) 1px, transparent 1px),
      var(--bg);
    background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
  }
  .app { max-width: 1240px; margin: 0 auto; padding: 28px 32px 18px; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 18px;
    padding-bottom: 20px; margin-bottom: 22px;
    border-bottom: 1px solid var(--line-2);
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(125, 180, 249, .22), rgba(125, 180, 249, .08));
    border: 1px solid rgba(125, 180, 249, .5);
    box-shadow: 0 4px 14px rgba(125, 180, 249, .28);
    font-size: 17px; color: #5a9bee;
  }
  .brand h1 { font-size: 19px; letter-spacing: .24em; font-weight: 700;
    background: linear-gradient(100deg, #3a4453, var(--acc2) 45%, var(--acc));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { display: block; font-size: 9px; letter-spacing: .34em; color: var(--dim); margin-top: 2px; }
  .status { display: flex; align-items: center; gap: 9px; margin-left: auto;
    font-size: 11px; letter-spacing: .14em; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc);
    box-shadow: 0 0 8px rgba(125, 180, 249, .8); position: relative; }
  .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 1px solid var(--acc); animation: ping 2s ease-out infinite; }
  .dot.off { background: #c3ccd8; box-shadow: none; }
  .dot.off::after { display: none; }
  @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 80%, 100% { transform: scale(1.5); opacity: 0; } }
  .roots { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clock { font-size: 17px; letter-spacing: .12em; color: #5c6a7d;
    font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
  .reload { margin-left: 4px; background: none; border: 1px solid var(--line); color: var(--dim);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .2s; }
  .reload:hover { color: var(--acc2); border-color: var(--acc); background: rgba(125, 180, 249, .08); }
  .reload.spin svg { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- hero: gauge + cards + chart ---- */
  .hero { display: grid; grid-template-columns: 250px 1fr; gap: 20px; margin-bottom: 20px; }
  .gauge {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .gauge::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--acc), transparent); }
  .gauge svg { width: 172px; height: 172px; }
  .g-track { fill: none; stroke: rgba(125, 180, 249, .16); stroke-width: 9; }
  .g-prog { fill: none; stroke: url(#gGrad); stroke-width: 9; stroke-linecap: round;
    filter: drop-shadow(0 0 5px rgba(125, 180, 249, .6));
    transition: stroke-dashoffset 1s cubic-bezier(.22, 1, .36, 1); }
  .gauge-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; }
  .gauge-label { font-size: 9px; letter-spacing: .3em; color: var(--dim); margin-bottom: 6px; }
  .gauge-value { font-size: 27px; font-weight: 700; color: #2c3542;
    font-variant-numeric: tabular-nums; }
  .gauge-sub { margin-top: 5px; font-size: 11px; color: var(--dim); }
  .gauge-sub b { font-weight: 600; }
  .gauge-sub b.up { color: var(--up); } .gauge-sub b.down { color: var(--down); }

  .hero-right { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    padding: 15px 17px 13px; position: relative; overflow: hidden;
  }
  .card::after { content: ""; position: absolute; top: 0; right: 0; width: 46px; height: 46px;
    background: radial-gradient(circle at top right, rgba(125, 180, 249, .12), transparent 70%); }
  .card .k { font-size: 9px; letter-spacing: .22em; color: var(--dim); margin-bottom: 7px; }
  .card .v { font-size: 24px; font-weight: 700; color: #2c3542; font-variant-numeric: tabular-nums; }
  .card .v.up { color: var(--up); }
  .card .v.down { color: var(--down); }
  .card .s { font-size: 10px; color: var(--dim); margin-top: 4px; }

  .chart-panel {
    grid-column: 1 / -1;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    padding: 15px 17px 12px;
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
  .panel-head span:first-child { font-size: 10px; letter-spacing: .26em; color: var(--dim); }
  .panel-head span:first-child::before { content: "▍"; color: var(--acc); margin-right: 7px; }
  .panel-head .hint { font-size: 10px; color: var(--dim); letter-spacing: .1em; }
  .chart { position: relative; height: 158px; }
  #chart { width: 100%; height: 100%; display: block; }
  .chart-tip {
    position: absolute; pointer-events: none; opacity: 0; transform: translateY(4px);
    background: rgba(255, 255, 255, .97); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 10.5px; line-height: 1.6;
    box-shadow: 0 8px 24px rgba(80, 110, 160, .16); transition: opacity .12s; z-index: 5;
    white-space: nowrap;
  }
  .chart-tip .t { color: var(--dim); } .chart-tip .tv { color: #2c3542; font-weight: 700; }
  .chart-tip .td { color: var(--acc2); } .chart-tip .td.up { color: var(--up); }
  .chart-cross { position: absolute; pointer-events: none; width: 1px;
    background: rgba(125, 180, 249, .5); }

  /* ---- tables ---- */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow); padding: 15px 17px 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 9px; letter-spacing: .2em; color: var(--dim); font-weight: 600;
    padding: 5px 8px 8px; border-bottom: 1px solid var(--line-2); }
  td { padding: 6.5px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap;
    font-size: 12px; transition: background .15s; }
  tr:hover td { background: rgba(125, 180, 249, .07); }
  td.path { color: #4a5568; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
  td.num { text-align: right; color: #3a4453; }
  td.dim { color: var(--dim); font-size: 11px; }
  td.delta.up { color: var(--up); } td.delta.down { color: var(--down); }
  .hbar { display: inline-block; height: 7px; border-radius: 2px; vertical-align: middle;
    background: linear-gradient(90deg, var(--acc), var(--acc2)); }
  .hbar.up { background: linear-gradient(90deg, #7db4f9, #4a7dbd); }
  .hbar.down { background: linear-gradient(90deg, #c3ccd8, #9aa4b2); }
  .empty { color: var(--dim); padding: 14px 8px; font-size: 11.5px; }
  tbody tr:last-child td { border-bottom: none; }

  footer { display: flex; gap: 22px; margin-top: 22px; padding-top: 14px;
    border-top: 1px solid var(--line-2); font-size: 10px; letter-spacing: .12em; color: var(--dim); }
  footer span:first-child { margin-right: auto; }

  /* 入场动画 */
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.22, 1, .36, 1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; }
    .hero-right { grid-template-columns: 1fr; }
    .cols { grid-template-columns: 1fr; }
    .clock { display: none; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">

  <header class="rise">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>OTSN</h1>
        <span class="tag">DISK TELEMETRY</span>
      </div>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="live">LIVE</span>
      <span class="roots" id="roots" title="monitored roots">—</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <button class="reload" id="reload" title="refresh now">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.3"/><polyline points="21 3 21 9 15 9"/>
      </svg>
    </button>
  </header>

  <section class="hero rise" style="animation-delay:.08s">
    <div class="gauge">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7db4f9"/>
            <stop offset="1" stop-color="#4a7dbd"/>
          </linearGradient>
        </defs>
        <circle class="g-track" cx="100" cy="100" r="84"/>
        <circle class="g-prog" id="gProg" cx="100" cy="100" r="84"
                stroke-dasharray="527.8" stroke-dashoffset="527.8"
                transform="rotate(-90 100 100)"/>
      </svg>
      <div class="gauge-center">
        <div class="gauge-label">DISK USED</div>
        <div class="gauge-value" id="gaugePct">—</div>
        <div class="gauge-sub" id="gaugeSub">—</div>
      </div>
    </div>

    <div class="hero-right">
      <div class="cards">
        <div class="card rise" style="animation-delay:.14s">
          <div class="k">LAST Δ</div><div class="v" id="deltaCard">—</div>
          <div class="s" id="deltaFiles">—</div>
        </div>
        <div class="card rise" style="animation-delay:.2s">
          <div class="k">ENTRIES</div><div class="v" id="entries">—</div>
          <div class="s" id="skips">—</div>
        </div>
        <div class="card rise" style="animation-delay:.26s">
          <div class="k">SNAPSHOTS</div><div class="v" id="snaps">—</div>
          <div class="s">retention 48</div>
        </div>
        <div class="card rise" style="animation-delay:.32s">
          <div class="k">TOTAL</div><div class="v" id="total">—</div>
          <div class="s" id="scanned">—</div>
        </div>
      </div>

      <div class="chart-panel rise" style="animation-delay:.38s">
        <div class="panel-head">
          <span>CAPACITY TIMELINE</span>
          <span class="hint" id="rangeHint">TOTAL BYTES</span>
        </div>
        <div class="chart" id="chartWrap">
          <svg id="chart"></svg>
          <div class="chart-tip" id="tip"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="cols rise" style="animation-delay:.44s">
    <div class="panel">
      <div class="panel-head"><span>TOP CONSUMERS</span><span class="hint">depth 2</span></div>
      <table><tbody id="top"><tr><td class="empty">loading…</td></tr></tbody></table>
    </div>
    <div class="panel">
      <div class="panel-head"><span>RECENT CHANGES</span><span class="hint">last interval</span></div>
      <table><tbody id="report"><tr><td class="empty">loading…</td></tr></tbody></table>
    </div>
  </section>

  <footer class="rise" style="animation-delay:.5s">
    <span>otsn v<span id="ver">—</span></span>
    <span>auto-refresh 10s</span>
    <span>local only · 127.0.0.1:8787</span>
  </footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const KB = 1024, MB = 1024 * KB, GB = 1024 * MB, TB = 1024 * GB;

const fmtB = (n, sign) => {
  if (n === null || n === undefined) return "—";
  if (n < 0) return "-" + fmtB(-n, false);
  const abs = Math.abs(n);
  let v, u;
  if (abs >= TB)      { v = n / TB; u = "TB"; }
  else if (abs >= GB) { v = n / GB; u = "GB"; }
  else if (abs >= MB) { v = n / MB; u = "MB"; }
  else if (abs >= KB) { v = n / KB; u = "KB"; }
  else                { v = n;      u = "B";  }
  return (abs >= KB ? v.toFixed(1) : String(v)) + " " + u;
};
const fmtInt = n => (n || 0).toLocaleString("en-US");
const fmtTime = t => {
  if (!t) return "never";
  const d = new Date(t);
  const p = x => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
};
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function get(p) {
  const r = await fetch(p);
  if (!r.ok) throw new Error(p + " " + r.status);
  return r.json();
}

/* ---- count-up animation ---- */
function countUp(el, target, fmt) {
  const from = parseFloat(el.dataset.val || "0");
  const to = target || 0;
  if (from === to) { el.textContent = fmt(to); el.dataset.val = String(to); return; }
  const t0 = performance.now(), dur = 550;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3); // ease-out cubic
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
    else { el.textContent = fmt(to); el.dataset.val = String(to); }
  };
  requestAnimationFrame(step);
}

/* ---- clock ---- */
function tickClock() {
  const d = new Date();
  const p = x => String(x).padStart(2, "0");
  $("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
setInterval(tickClock, 1000);
tickClock();

/* ---- status + cards + gauge ---- */
async function loadStatus() {
  const s = await get("/api/status");
  $("ver").textContent = s.version || "—";
  $("roots").textContent = (s.roots || []).join("  ") || "—";
  const online = !!s.scannedAt;
  $("dot").className = "dot" + (online ? "" : " off");
  $("live").textContent = online ? "LIVE" : "OFFLINE";

  countUp($("total"), s.total, v => fmtB(v));
  countUp($("entries"), s.entries, v => fmtInt(Math.round(v)));
  countUp($("snaps"), s.history, v => fmtInt(Math.round(v)));
  $("scanned").textContent = fmtTime(s.scannedAt);
  $("skips").textContent = "skipped " + fmtInt(s.skips);
  drawGauge(s.disks || []);
  return s;
}

/* gauge ring: real disk usage ratio (used / total capacity) */
function drawGauge(disks) {
  const C = 527.8;
  const prog = $("gProg");
  const pctEl = $("gaugePct");
  const sub = $("gaugeSub");
  if (!disks.length) {
    prog.style.strokeDashoffset = String(C);
    pctEl.textContent = "—";
    sub.textContent = "no disk data";
    return;
  }
  const d = disks[0];
  const frac = d.total > 0 ? d.used / d.total : 0;
  prog.style.strokeDashoffset = String(C * (1 - Math.min(1, frac)));
  countUp(pctEl, frac * 100, v => v.toFixed(1) + "%");
  sub.textContent = fmtB(d.used) + " of " + fmtB(d.total);
}

async function loadDelta() {
  const h = await get("/api/history");
  const hist = (h.history || []).filter(e => e.total != null);
  if (!hist.length) {
    $("deltaCard").textContent = "—";
    $("deltaCard").className = "v";
    $("deltaFiles").textContent = "no history yet";
    drawChart([]);
    return hist;
  }
  const last = hist[hist.length - 1];
  const d = last.delta || 0;
  const el = $("deltaCard");
  countUp(el, d, v => (v > 0 ? "+" : "") + fmtB(v));
  el.className = "v" + (d > 0 ? " up" : d < 0 ? " down" : "");
  $("deltaFiles").textContent = fmtInt(last.files) + " files · " + fmtTime(last.time);

  drawChart(hist);
  return hist;
}

/* ---- timeline chart (SVG area + glow line + hover crosshair) ---- */
let chartData = [];
const CHART_ACC = "#7db4f9";
const CHART_ACC2 = "#4a7dbd";
function drawChart(hist) {
  chartData = hist;
  const svg = $("chart");
  const wrap = $("chartWrap");
  const W = Math.max(300, wrap.clientWidth), H = 158;
  const padL = 8, padR = 8, padT = 12, padB = 18;
  const vals = hist.map(e => e.total);
  const min = vals.length ? Math.min(...vals) : 0;
  const max = vals.length ? Math.max(...vals) : 1;
  const span = (max - min) || 1;
  const n = vals.length;
  const x = i => padL + (n <= 1 ? 0 : i * (W - padL - padR) / (n - 1));
  const y = v => padT + (1 - (v - min) / span) * (H - padT - padB);
  const pts = vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const area = padL + "," + (H - padB) + " " + pts + " " + (n ? x(n - 1) : padL) + "," + (H - padB);

  let grid = "";
  for (let g = 0; g < 4; g++) {
    const gy = padT + g * (H - padT - padB) / 3;
    grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) +
            '" y2="' + gy + '" stroke="rgba(125,180,249,.14)" stroke-width="1"/>';
  }

  let dots = "";
  if (n <= 90) {
    dots = vals.map((v, i) =>
      '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.4" fill="#ffffff" stroke="' + CHART_ACC + '" stroke-width="1.4"/>'
    ).join("");
  }

  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML =
    '<defs><linearGradient id="aGrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + CHART_ACC + '" stop-opacity=".34"/>' +
    '<stop offset="1" stop-color="' + CHART_ACC + '" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<polygon points="' + area + '" fill="url(#aGrad)"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + CHART_ACC + '" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round" ' +
      'style="filter:drop-shadow(0 1px 3px rgba(74,125,189,.35))"/>' +
    dots;
}

function chartHover(ev) {
  const tip = $("tip"), wrap = $("chartWrap");
  const r = wrap.getBoundingClientRect();
  const mx = ev.clientX - r.left;
  if (!chartData.length) { tip.style.opacity = "0"; hideCross(); return; }
  const W = wrap.clientWidth, padL = 8, padR = 8;
  const n = chartData.length;
  const x = i => padL + (n <= 1 ? 0 : i * (W - padL - padR) / (n - 1));
  let best = 0, bestD = Infinity;
  for (let i = 0; i < n; i++) {
    const d = Math.abs(x(i) - mx);
    if (d < bestD) { bestD = d; best = i; }
  }
  const e = chartData[best];
  const cx = x(best);
  showCross(cx);
  tip.innerHTML = '<div class="t">' + fmtTime(e.time) + '</div>' +
    '<div class="tv">' + fmtB(e.total) + '</div>' +
    (e.delta ? '<div class="td ' + (e.delta > 0 ? "up" : "") + '">' +
      (e.delta > 0 ? "+" : "") + fmtB(e.delta) + '</div>' : "");
  tip.style.opacity = "1";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const tx = Math.min(Math.max(8, mx - tw / 2), r.width - tw - 8);
  const ty = Math.max(6, ev.clientY - r.top - th - 14);
  tip.style.left = tx + "px";
  tip.style.top = ty + "px";
}
let crossEl = null;
function showCross(cx) {
  if (!crossEl) {
    crossEl = document.createElement("div");
    crossEl.className = "chart-cross";
    $("chartWrap").appendChild(crossEl);
  }
  crossEl.style.opacity = "1";
  crossEl.style.left = cx + "px";
  crossEl.style.top = "10px";
  crossEl.style.height = "140px";
}
function hideCross() { if (crossEl) crossEl.style.opacity = "0"; }

/* ---- tables ---- */
function hbar(frac, maxW, cls) {
  const w = Math.max(2, Math.round(frac * maxW));
  return '<span class="hbar ' + cls + '" style="width:' + w + 'px"></span>';
}

async function loadTop() {
  const t = await get("/api/top?depth=2&n=12");
  const tb = $("top");
  const groups = t.groups || [];
  if (!groups.length) {
    tb.innerHTML = '<tr><td class="empty">no snapshots yet — run <b>otsn scan</b></td></tr>';
    return;
  }
  tb.innerHTML = '<tr><th>PATH</th><th style="text-align:right">SIZE</th>' +
    '<th style="text-align:right">SHARE</th><th style="width:34%"></th></tr>' +
    groups.map(g =>
      '<tr><td class="path" title="' + esc(g.path) + '">' + esc(g.path) + '</td>' +
      '<td class="num">' + fmtB(g.size) + '</td>' +
      '<td class="num dim">' + (100 * g.share).toFixed(1) + '%</td>' +
      '<td>' + hbar(g.share, 120, "") + '</td></tr>'
    ).join("");
}

async function loadReport() {
  const r = await get("/api/report?depth=3&top=12&min=1MB");
  const tb = $("report");
  const groups = r.groups || [];
  if (!groups.length) {
    tb.innerHTML = '<tr><td class="empty">no significant changes between snapshots</td></tr>';
    return;
  }
  const maxD = Math.max(1, ...groups.map(g => Math.abs(g.delta)));
  tb.innerHTML = '<tr><th>PATH</th><th style="text-align:right">DELTA</th>' +
    '<th style="text-align:right">AFTER</th><th style="width:34%"></th></tr>' +
    groups.map(g => {
      const up = g.delta >= 0;
      return '<tr><td class="path" title="' + esc(g.path) + '">' + esc(g.path) + '</td>' +
        '<td class="num delta ' + (up ? "up" : "down") + '">' + (up ? "+" : "") + fmtB(g.delta) + '</td>' +
        '<td class="num dim">' + fmtB(g.after) + '</td>' +
        '<td>' + hbar(Math.abs(g.delta) / maxD, 120, up ? "up" : "down") + '</td></tr>';
    }).join("");
}

/* ---- refresh loop ---- */
let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    await Promise.all([loadStatus(), loadDelta(), loadTop(), loadReport()]);
    $("live").textContent = "LIVE";
  } catch (e) {
    $("dot").className = "dot off";
    $("live").textContent = "OFFLINE";
  } finally {
    refreshing = false;
  }
}

const wrap = $("chartWrap");
wrap.addEventListener("mousemove", chartHover);
wrap.addEventListener("mouseleave", () => { $("tip").style.opacity = "0"; hideCross(); });
$("reload").addEventListener("click", () => {
  $("reload").classList.add("spin");
  setTimeout(() => $("reload").classList.remove("spin"), 650);
  refresh();
});
window.addEventListener("resize", () => drawChart(chartData));

refresh();
setInterval(refresh, 10000);
</script>
